name: daily-zmvrv

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily — after the on-chain day closes and sources update
  workflow_dispatch:       # manual "Run workflow" button for re-runs

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect Z-MVRV
        run: node scripts/collect.js
      - name: Collect Hash Ribbon
        if: always()
        run: node scripts/collect-hashribbon.js
      - name: Commit data
        if: always()
        run: |
          git config user.name  "zmvrv-bot"
          git config user.email "zmvrv-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push

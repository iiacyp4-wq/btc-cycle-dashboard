<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-MVRV · Classic</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1a1d23; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:20px 16px 40px; }
  .banner { border-radius:8px; padding:10px 14px; font-size:14px; margin-bottom:14px; }
  .banner.hidden { display:none; }
  .banner.stale { background:#fef9c3; color:#854d0e; }
  .banner.bad { background:#fee2e2; color:#991b1b; }
  .banner.warn { background:#ffedd5; color:#9a3412; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:22px 20px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  h1 { font-size:15px; font-weight:600; color:var(--muted); letter-spacing:.04em; }
  .head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-top:6px; }
  .value { font-size:60px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .delta { font-size:16px; font-weight:600; }
  .delta.up { color:#16a34a; } .delta.down { color:#dc2626; }
  .zone { font-size:13px; font-weight:600; padding:4px 10px; border-radius:999px; }
  .zone.low { background:#dbeafe; color:#1e40af; } .zone.mid { background:#f3f4f6; color:#374151; }
  .zone.hot { background:#fef3c7; color:#92400e; } .zone.top { background:#fee2e2; color:#991b1b; }
  .date { font-size:13px; color:var(--muted); margin-top:4px; }
  .toolbar { display:flex; justify-content:flex-end; margin:22px 0 8px; }
  #ranges button { border:1px solid var(--line); background:#fff; color:var(--muted); font-size:12px; padding:5px 10px; cursor:pointer; }
  #ranges button:first-child { border-radius:6px 0 0 6px; } #ranges button:last-child { border-radius:0 6px 6px 0; }
  #ranges button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chartbox { position:relative; height:300px; }
  canvas { width:100%; height:100%; display:block; }
  #tooltip { position:absolute; display:none; background:#111827; color:#fff; font-size:12px; padding:5px 8px; border-radius:6px; pointer-events:none; white-space:nowrap; }
  .susp { background:#f97316; padding:1px 5px; border-radius:4px; font-size:10px; }
  footer { font-size:12px; color:var(--muted); margin-top:18px; line-height:1.6; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner" class="banner hidden"></div>
  <div class="card">
    <h1>Z-MVRV</h1>
    <div class="head">
      <div class="value" id="value">—</div>
      <div class="delta" id="delta"></div>
      <div class="zone" id="zone"></div>
    </div>
    <div class="date" id="date"></div>
    <div class="toolbar" style="justify-content:space-between"><span style="font-size:12px;color:var(--muted)">드래그로 확대 · 더블클릭 원복</span><div id="ranges">
      <button data-r="1Y">1Y</button><button data-r="3Y">3Y</button><button data-r="ALL">전체</button>
    </div></div>
    <div class="chartbox"><canvas id="chart"></canvas><div id="tooltip"></div></div>
    <footer><div id="footer-src"></div><a href="data/zmvrv.csv">원본 CSV 보기</a></footer>
  </div>
</div>
<script src="data/zmvrv.js"></script>
<script src="dashboard-core.js"></script>
<script>
renderDashboard({
  font: 'system-ui, sans-serif',
  colors: { line:'#2563eb', latest:'#2563eb', latestRing:'#fff', suspicious:'#f97316', grid:'#eef0f3', muted:'#9ca3af',
    band:{ low:'rgba(37,99,235,.06)', mid:'rgba(0,0,0,0)', hot:'rgba(245,158,11,.08)', top:'rgba(220,38,38,.08)' } }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z-MVRV · Terminal</title>
<style>
  :root { --bg:#0b0e14; --card:#111622; --text:#e6edf3; --muted:#7d8590; --line:#1f2733; --accent:#f7931a; --green:#3fb950; --red:#f85149; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"JetBrains Mono","SF Mono",Consolas,"D2Coding",monospace; }
  .wrap { max-width:760px; margin:0 auto; padding:18px 14px 40px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:12px; }
  .top b { color:var(--accent); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:6px; box-shadow:0 0 8px var(--green); }
  .banner { border:1px solid; padding:9px 12px; font-size:13px; margin-bottom:12px; }
  .banner.hidden { display:none; }
  .banner.stale { border-color:#9e6a03; color:#e3b341; background:rgba(227,179,65,.08); }
  .banner.bad { border-color:var(--red); color:var(--red); background:rgba(248,81,73,.08); }
  .banner.warn { border-color:#db6d28; color:#f0883e; background:rgba(240,136,62,.08); }
  .card { background:var(--card); border:1px solid var(--line); padding:18px 18px 16px; }
  h1 { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.15em; }
  h1::before { content:"> "; color:var(--accent); }
  .head { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .value { font-size:64px; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; text-shadow:0 0 24px rgba(247,147,26,.35); }
  .delta { font-size:15px; } .delta.up { color:var(--green); } .delta.down { color:var(--red); }
  .zone { font-size:12px; padding:3px 8px; border:1px solid; letter-spacing:.05em; }
  .zone.low { color:#58a6ff; border-color:#58a6ff; } .zone.mid { color:var(--muted); border-color:var(--muted); }
  .zone.hot { color:#e3b341; border-color:#e3b341; } .zone.top { color:var(--red); border-color:var(--red); }
  .date { font-size:12px; color:var(--muted); margin-top:6px; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin:20px 0 6px; font-size:11px; color:var(--muted); }
  #ranges button { background:none; border:1px solid var(--line); color:var(--muted); font:inherit; font-size:11px; padding:4px 9px; cursor:pointer; margin-left:-1px; }
  #ranges button.active { color:var(--accent); border-color:var(--accent); }
  .chartbox { position:relative; height:320px; border-top:1px dashed var(--line); padding-top:8px; }
  canvas { width:100%; height:100%; display:block; }
  #tooltip { position:absolute; display:none; background:#000; border:1px solid var(--accent); color:var(--text); font-size:11px; padding:4px 8px; pointer-events:none; white-space:nowrap; }
  .susp { color:#f0883e; }
  footer { font-size:11px; color:var(--muted); margin-top:16px; line-height:1.7; }
  footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><span class="dot"></span>BTC CYCLE MONITOR</span><span>daily · <b>UTC</b></span></div>
  <div id="banner" class="banner hidden"></div>
  <div class="card">
    <h1>Z-MVRV</h1>
    <div class="head">
      <div class="value" id="value">—</div>
      <div class="delta" id="delta"></div>
      <div class="zone" id="zone"></div>
    </div>
    <div class="date" id="date"></div>
    <div class="toolbar"><span>범위</span><div id="ranges">
      <button data-r="1Y">1Y</button><button data-r="3Y">3Y</button><button data-r="ALL">전체</button>
    </div></div>
    <div class="chartbox"><canvas id="chart"></canvas><div id="tooltip"></div></div>
    <footer><div id="footer-src"></div><a href="data/zmvrv.csv">$ cat data/zmvrv.csv</a></footer>
  </div>
</div>
<script src="data/zmvrv.js"></script>
<script src="dashboard-core.js"></script>
<script>
renderDashboard({
  font: 'monospace',
  colors: { line:'#f7931a', latest:'#f7931a', latestRing:'#0b0e14', suspicious:'#f0883e', grid:'#1f2733', muted:'#7d8590',
    band:{ low:'rgba(88,166,255,.07)', mid:'rgba(0,0,0,0)', hot:'rgba(227,179,65,.07)', top:'rgba(248,81,73,.09)' } }
});
</script>
</body>
</html>
